name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Do not install obsolete `tools` package (removed from sdkmanager).
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug and run unit tests
        # Debug passwords come from repo secrets, never from files in git.
        # If the secrets are unset, the build falls back to the default Android debug key.
        env:
          VICTORCAM_DEBUG_STORE_PASSWORD: ${{ secrets.VICTORCAM_DEBUG_STORE_PASSWORD }}
          VICTORCAM_DEBUG_KEY_PASSWORD: ${{ secrets.VICTORCAM_DEBUG_KEY_PASSWORD }}
        run: ./gradlew assembleDebug test --stacktrace

      - name: Report debug signing cert
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | grep -E 'DN|SHA-256'

      - name: Upload debug APK for module pack
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  module-zip:
    name: Pack optional root module
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: artifacts/apk

      - name: Pack module zip
        run: |
          chmod +x module/pack-module.sh
          bash module/pack-module.sh \
            --apk artifacts/apk/app-debug.apk \
            --out "$PWD/module-dist/victorcam-root-module.zip"

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: victorcam-root-module
          path: module-dist/victorcam-root-module.zip
          if-no-files-found: error

